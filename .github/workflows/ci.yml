name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # BUILD_SPLENDMED.md §3.1 and §3.4. These must run on every change:
      # they are the mechanical enforcement of two non-negotiable guardrails.
      - name: Guardrails
        run: pnpm guard

      - name: Build
        run: pnpm build

      # E2E runs against the production build, which is what deploys. It is kept
      # out of `pnpm verify` because it needs a server and takes ~2 minutes;
      # here it is cheap insurance on every push.
      - name: Install Playwright browser
        run: pnpm --filter @splendmed/web exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm --filter @splendmed/web test:e2e
